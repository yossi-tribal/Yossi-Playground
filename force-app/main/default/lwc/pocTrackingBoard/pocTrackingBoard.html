<template>
    <div class="board-app">
        <header class="board-header">
            <div>
                <h1>POC Tracking Board</h1>
                <p class="subtitle">Proof-of-concept engagements grouped by lifecycle status.</p>
            </div>
            <div class="avatar-stack" aria-label="POC owners">
                <template for:each={owners.shown} for:item="owner">
                    <span key={owner.ownerId} class={owner.ownerAvatarClass} title={owner.ownerLabel}>{owner.ownerInitials}</span>
                </template>
                <template lwc:if={owners.hasExtra}>
                    <span class="extra-count">{owners.extraLabel}</span>
                </template>
            </div>
        </header>

        <nav class="view-tabs" aria-label="Board views">
            <template for:each={viewTabs} for:item="tab">
                <button
                    key={tab.id}
                    type="button"
                    class={tab.className}
                    data-view={tab.id}
                    aria-pressed={tab.pressed}
                    onclick={handleView}>
                    <template lwc:if={tab.isOverview}>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="3" width="7.5" height="7.5" rx="1.5"></rect>
                            <rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"></rect>
                            <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"></rect>
                            <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"></rect>
                        </svg>
                    </template>
                    <template lwc:if={tab.isBoard}>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="4" width="5" height="16" rx="1.5"></rect>
                            <rect x="10" y="4" width="5" height="11" rx="1.5"></rect>
                            <rect x="17" y="4" width="4" height="14" rx="1.5"></rect>
                        </svg>
                    </template>
                    <template lwc:if={tab.isList}>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 6h13M8 12h13M8 18h13"></path>
                            <circle cx="4" cy="6" r="1.2"></circle>
                            <circle cx="4" cy="12" r="1.2"></circle>
                            <circle cx="4" cy="18" r="1.2"></circle>
                        </svg>
                    </template>
                    <template lwc:if={tab.isTimeline}>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="8"></circle>
                            <path d="M12 8v5l3 2"></path>
                        </svg>
                    </template>
                    {tab.label}
                </button>
            </template>
        </nav>

        <template lwc:if={isComingSoonView}>
            <section class="soon-page">
                <div class="soon-page-card">
                    <h2>{comingSoonTitle}</h2>
                    <div class="soon-box">
                        <span class="soon-flag">Coming soon</span>
                        <p>{comingSoonDetail}</p>
                    </div>
                </div>
            </section>
        </template>
        <template lwc:elseif={isLoading}>
            <div class="loading" role="status">
                <span class="spinner" aria-hidden="true"></span>
                Loading POCs…
            </div>
        </template>
        <template lwc:elseif={errorMessage}>
            <div class="error-banner" role="alert">{errorMessage}</div>
        </template>
        <template lwc:elseif={showBoard}>
            <template lwc:if={truncated}>
                <p class="limit-note">Showing the first 500 POCs, ordered by name.</p>
            </template>
            <template lwc:if={isEmpty}>
                <p class="empty-banner">No POC records yet. Managers can add one with the + on a column.</p>
            </template>
            <div class="columns">
                <template for:each={columns} for:item="column">
                    <section key={column.value} class="column" aria-label={column.label}>
                        <header class="column-header">
                            <div class="column-title">
                                <span class={column.dotClass} aria-hidden="true"></span>
                                <h2>{column.label}</h2>
                                <span class="count">{column.count}</span>
                            </div>
                            <button type="button" class="icon-btn" data-status={column.value} onclick={handleNew} aria-label={column.newLabel}>+</button>
                        </header>
                        <div class="column-body">
                            <template lwc:if={column.isEmpty}>
                                <p class="empty-col">No POCs in this stage</p>
                            </template>
                            <template for:each={column.cards} for:item="card">
                                <div
                                    key={card.id}
                                    class={card.cardClass}
                                    role="button"
                                    tabindex="0"
                                    data-id={card.id}
                                    onclick={handleOpen}
                                    onkeydown={handleCardKeydown}>
                                    <div class="card-top">
                                        <h3 class="card-title">{card.name}</h3>
                                        <span class={card.healthClass}>
                                            <span class="mini-dot" aria-hidden="true"></span>
                                            {card.healthLabel}
                                        </span>
                                    </div>
                                    <div class="badge-row">
                                        <template lwc:if={card.hasType}>
                                            <span class={card.typeClass}>{card.pocType}</span>
                                        </template>
                                        <template lwc:if={card.hasLength}>
                                            <span class="badge badge-length">{card.length}</span>
                                        </template>
                                    </div>
                                    <div class="kicker">Next action</div>
                                    <template lwc:if={card.hasNextAction}>
                                        <p class="next-text">{card.nextAction}</p>
                                    </template>
                                    <template lwc:else>
                                        <p class="next-text muted">No next steps yet</p>
                                    </template>
                                    <div class="owner-row">
                                        <span class="kicker owner-kicker">Owner</span>
                                        <span class={card.ownerAvatarSmClass} title={card.ownerLabel}>{card.ownerInitials}</span>
                                        <span class="owner-name">{card.ownerLabel}</span>
                                    </div>
                                    <div class="card-foot">
                                        <span class="amount">Opp {card.amountLabel}</span>
                                        <span class="dates">{card.dateLabel}</span>
                                    </div>
                                    <div class="account-line">{card.accountLabel}</div>
                                    <div class="soon-box soon-card">
                                        <span class="soon-flag">Coming soon</span>
                                        <p>Due date, last contact, region, and team</p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </section>
                </template>
            </div>
        </template>

        <template lwc:if={selected}>
            <div class="backdrop" onclick={handleClose}></div>
            <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="poc-drawer-title" onclick={handleDrawerClick}>
                <div class="drawer-head">
                    <div class="drawer-top">
                        <div class="pill-row">
                            <span class={selected.statusClass}>{selected.statusLabel}</span>
                            <span class={selected.healthClass}>
                                <span class="mini-dot" aria-hidden="true"></span>
                                {selected.healthLabel}
                            </span>
                        </div>
                        <div class="drawer-actions">
                            <button type="button" class="text-btn" onclick={handleOpenRecord}>Open record</button>
                            <button type="button" class="drawer-close" onclick={handleClose} aria-label="Close">×</button>
                        </div>
                    </div>
                    <h2 id="poc-drawer-title" class="drawer-title">{selected.name}</h2>
                </div>
                <div class="drawer-body">
                    <div class="stat-grid">
                        <div class="stat">
                            <span class="stat-label">Engagement type</span>
                            <span class="stat-value">{selected.typeLabel}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Region</span>
                            <div class="soon-box soon-inline"><span class="soon-flag">Coming soon</span></div>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Opp amount</span>
                            <span class="stat-value">{selected.amountLabel}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Close date</span>
                            <div class="soon-box soon-inline"><span class="soon-flag">Coming soon</span></div>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Length</span>
                            <span class="stat-value">{selected.lengthLabel}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Start date</span>
                            <span class="stat-value">{selected.startLabel}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">End date</span>
                            <span class="stat-value">{selected.endLabel}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Account</span>
                            <template lwc:if={selected.hasAccountLink}>
                                <button type="button" class="linkish" data-id={selected.accountId} data-object="Account" onclick={handleOpenRelated}>{selected.accountLabel}</button>
                            </template>
                            <template lwc:else>
                                <span class="stat-value">{selected.accountLabel}</span>
                            </template>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Opportunity</span>
                            <template lwc:if={selected.hasOpportunityLink}>
                                <button type="button" class="linkish" data-id={selected.opportunityId} data-object="Opportunity" onclick={handleOpenRelated}>{selected.opportunityLabel}</button>
                            </template>
                            <template lwc:else>
                                <span class="stat-value">{selected.opportunityLabel}</span>
                            </template>
                        </div>
                    </div>

                    <section class="panel-section">
                        <h3>
                            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><circle cx="17" cy="9" r="2.2"></circle><path d="M3.5 19c.6-3 2.8-4.5 5.5-4.5S14 16 14.6 19"></path><path d="M16 14.6c1.8.2 3.3 1.3 4 3.4"></path></svg>
                            POC assignees
                        </h3>
                        <div class="person-row">
                            <span class={selected.ownerAvatarLgClass}>{selected.ownerInitials}</span>
                            <div>
                                <div class="person-name">{selected.ownerLabel}</div>
                                <div class="person-role">Owner</div>
                            </div>
                        </div>
                        <div class="soon-box">
                            <span class="soon-flag">Coming soon</span>
                            <p>Additional teammates and roles on this POC.</p>
                        </div>
                    </section>

                    <section class="panel-section">
                        <h3>
                            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 12.5l2.2 2.2L16 9"></path></svg>
                            Next steps and action items
                        </h3>
                        <div class={selected.notesClass}>{selected.nextStepsText}</div>
                        <div class="soon-box">
                            <span class="soon-flag">Coming soon</span>
                            <p>Task checklist with owners and due dates.</p>
                        </div>
                    </section>

                    <section class="panel-section">
                        <h3>
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V6.5A2.5 2.5 0 0 1 6.5 4H20v13.5"></path><path d="M4 19a2.5 2.5 0 0 1 2.5-2.5H20"></path></svg>
                            Enablement sessions
                        </h3>
                        <div class="soon-box">
                            <span class="soon-flag">Coming soon</span>
                            <p>Customer sessions and who has completed them.</p>
                        </div>
                    </section>

                    <section class="panel-section">
                        <h3>
                            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"></circle><path d="M5 19c.8-3.2 3.2-5 7-5s6.2 1.8 7 5"></path></svg>
                            Key client contacts
                        </h3>
                        <div class="soon-box">
                            <span class="soon-flag">Coming soon</span>
                            <p>Customer contacts and their role on this POC.</p>
                        </div>
                    </section>

                    <section class="panel-section">
                        <h3>
                            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M8 3v4M16 3v4M4 10h16"></path></svg>
                            Meeting history and schedule
                        </h3>
                        <div class="soon-box">
                            <span class="soon-flag">Coming soon</span>
                            <p>Events captured against this POC.</p>
                        </div>
                    </section>

                    <section class="panel-section">
                        <h3>
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14v9H8l-3 3V6z"></path></svg>
                            Communication channels
                        </h3>
                        <div class="soon-box">
                            <span class="soon-flag">Coming soon</span>
                            <p>Slack, email, and other channels for this POC.</p>
                        </div>
                    </section>

                    <section class="panel-section">
                        <h3>
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16"></path><path d="M8 15l3-4 3 2 4-6"></path></svg>
                            Usage analytics
                        </h3>
                        <div class="soon-box">
                            <span class="soon-flag">Coming soon</span>
                            <p>Tenant usage from PostHog and Logfire.</p>
                        </div>
                    </section>
                </div>
            </aside>
        </template>
    </div>
</template>
